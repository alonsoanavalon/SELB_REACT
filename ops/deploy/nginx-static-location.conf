# Install only inside the already-approved HTTPS server block after validating the
# effective production configuration. The API server block/location is unchanged.
root /opt/selb/current/frontend;

location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location = /static/js/bundle.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}
